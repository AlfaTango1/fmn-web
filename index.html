<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b17">
<title>Flight Mission Navigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Saira+Semi+Condensed:wght@400;500;600&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="anonymous" onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FMN">
<style>
/* Layout: full-bleed moving map; mission sheet docks bottom on phones / left on wide screens; flight display pinned to the top.
   Palette: night = olive-black cockpit with NVG-green data, amber caution, red warning; day = field khaki with olive ink. Route stays magenta by navigator convention. */
:root{
  --bg:#d9e0ea; --surface:#f2f5fa; --surface-2:#e3e9f2; --line:#b5c2d6; --fg:#0f1a2e; --muted:#4f5f7a;
  --accent:#1f5fae; --accent-fg:#f5f8fc; --accent-soft:#d3e2f5; --data:#0b4a8f;
  --route:#a0157a; --nav:#185d86; --ok:#2f6f1d; --warn:#9a5e00; --danger:#b3201f;
  --z-trn:#1f7a6e; --z-exr:#5a4ab0; --z-r:#9a5e00; --z-d:#c04a14; --z-p:#b3201f; --z-c:#3b6aa0;
  --halo:#f5f8fc; --tile-filter:none; --shadow:0 6px 22px rgba(10,20,45,.22);
  --f-display:"Saira Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Saira Semi Condensed","Segoe UI",Roboto,system-ui,sans-serif;
  --f-data:"Share Tech Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --hud-h:0px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#050b17; --surface:#0a1428; --surface-2:#0f1d36; --line:#1d3256; --fg:#d6e2f5; --muted:#7f93b5;
  --accent:#3fb6ff; --accent-fg:#031021; --accent-soft:#0f2a4a; --data:#5ee0ff;
  --route:#ff4fc3; --nav:#7fb2ff; --ok:#4fe3a0; --warn:#ffb547; --danger:#ff5a5f;
  --z-trn:#46c9b4; --z-exr:#a596ff; --z-r:#ffb547; --z-d:#ff8a3d; --z-p:#ff5a5f; --z-c:#6fa8e8;
  --halo:#050b17; --shadow:0 6px 24px rgba(0,0,0,.6); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#050b17; --surface:#0a1428; --surface-2:#0f1d36; --line:#1d3256; --fg:#d6e2f5; --muted:#7f93b5;
  --accent:#3fb6ff; --accent-fg:#031021; --accent-soft:#0f2a4a; --data:#5ee0ff;
  --route:#ff4fc3; --nav:#7fb2ff; --ok:#4fe3a0; --warn:#ffb547; --danger:#ff5a5f;
  --z-trn:#46c9b4; --z-exr:#a596ff; --z-r:#ffb547; --z-d:#ff8a3d; --z-p:#ff5a5f; --z-c:#6fa8e8;
  --halo:#050b17; --shadow:0 6px 24px rgba(0,0,0,.6); color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--f-body);overflow:hidden;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
#map{position:fixed;inset:0;background:var(--surface-2)}
#map.picking{cursor:crosshair}
.leaflet-container{font:inherit;background:var(--surface-2)}
.leaflet-tile-pane{filter:var(--tile-filter)}
.leaflet-control-attribution{font-size:10px;background:color-mix(in srgb,var(--surface) 80%,transparent)!important;color:var(--muted)}
.leaflet-control-attribution a{color:var(--muted)}
.leaflet-control-scale-line{background:color-mix(in srgb,var(--surface) 75%,transparent);color:var(--fg);border-color:var(--fg);font-family:var(--f-data)}
.leaflet-bar a{background:var(--surface);color:var(--fg);border-color:var(--line)}
.leaflet-top{top:calc(var(--hud-h) + env(safe-area-inset-top,0px))}
.leaflet-right{right:env(safe-area-inset-right,0px)}
@media (pointer:coarse){.leaflet-control-zoom{display:none}}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--fg);box-shadow:var(--shadow);border-radius:6px}
.leaflet-popup-content-wrapper{border:1px solid var(--line)}
.leaflet-popup-content{margin:12px 14px;min-width:230px;max-height:52vh;overflow-y:auto}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}

/* map symbology */
.pt-ico{color:var(--fg)} .pt-ico.nav{color:var(--nav)} .pt-ico.hl{color:var(--route)}
.pt-ico.lib{opacity:.82} .pt-ico.lib .pt-lbl{font-weight:500;font-size:11.5px}
#map.z-lo .pt-ico.lib .pt-lbl{display:none}
.pt-ico svg{overflow:visible;display:block;filter:drop-shadow(0 0 1.2px var(--halo)) drop-shadow(0 0 1.2px var(--halo))}
.pt-lbl{position:absolute;left:24px;top:3px;white-space:nowrap;font:600 12.5px/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase;color:inherit;text-shadow:0 0 2px var(--halo),0 0 2px var(--halo),0 0 3px var(--halo);pointer-events:none}
.leg-lbl,.zone-lbl,.meas-lbl{white-space:nowrap;font:12px/1.15 var(--f-data);padding:2px 5px;border-radius:2px;transform:translate(-50%,-50%);display:inline-block;pointer-events:none}
.leg-lbl{background:var(--surface);color:var(--route);border:1px solid var(--route)}
.leg-lbl.dim{color:var(--muted);border-color:var(--line)}
.meas-lbl{background:var(--fg);color:var(--surface)}
.zone-lbl{font-family:var(--f-display);font-weight:600;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;text-align:center;color:var(--zc);text-shadow:0 0 2px var(--halo),0 0 3px var(--halo)}
#map.z-lo .zone-lbl.lib{display:none}
.rte{stroke:var(--muted);stroke-dasharray:8 6;fill:none}
.rte.active{stroke:var(--route);stroke-dasharray:none}
.gotoline{stroke:var(--route);stroke-dasharray:2 6;fill:none}
.trk{stroke:var(--nav);fill:none;opacity:.85}
.tool-line{stroke:var(--fg);stroke-dasharray:6 4;fill:none}
.tool-radial{stroke:var(--nav);stroke-dasharray:4 4;fill:none}
.zone{fill-opacity:.12;stroke-width:2}
.zone.lib{fill-opacity:.07;stroke-width:1.5}
.z-TRN{stroke:var(--z-trn);fill:var(--z-trn)} .z-EXR{stroke:var(--z-exr);fill:var(--z-exr)}
.z-R{stroke:var(--z-r);fill:var(--z-r);stroke-dasharray:7 5} .z-D{stroke:var(--z-d);fill:var(--z-d);stroke-dasharray:7 5}
.z-P{stroke:var(--z-p);fill:var(--z-p);stroke-dasharray:3 4;fill-opacity:.18} .z-C{stroke:var(--z-c);fill:var(--z-c);fill-opacity:.04}
.acc-circle{stroke:var(--nav);fill:var(--nav);fill-opacity:.08;stroke-width:1}
.ac-ico svg{display:block;overflow:visible;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.ac-body{fill:var(--accent);stroke:var(--halo);stroke-width:1.5}
.tool-pin{width:16px;height:16px;border-radius:50%;border:3px solid var(--fg);background:var(--surface);box-shadow:0 0 0 2px var(--halo)}
.vtx{width:12px;height:12px;background:var(--fg);border:2px solid var(--halo)}

/* floating controls */
#fab{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));top:calc(var(--hud-h) + env(safe-area-inset-top,0px) + 92px);display:flex;flex-direction:column;gap:8px;z-index:500}
@media (pointer:coarse){#fab{top:calc(var(--hud-h) + env(safe-area-inset-top,0px) + 12px)}}
.fab{width:48px;height:48px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center;box-shadow:var(--shadow);cursor:pointer;font:600 13px/1 var(--f-display);letter-spacing:.06em}
.fab svg{width:22px;height:22px}
.fab.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
#layerMenu{position:fixed;right:calc(66px + env(safe-area-inset-right,0px));top:calc(var(--hud-h) + env(safe-area-inset-top,0px) + 12px);z-index:600;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:6px;min-width:240px;max-width:calc(100vw - 84px);max-height:70vh;overflow-y:auto}
#layerMenu button{display:block;width:100%;text-align:left;padding:10px;border:0;background:none;border-radius:4px;cursor:pointer}
#layerMenu button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
#layerMenu .lm-h{font:600 11px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px}
#layerMenu label{display:flex;align-items:center;gap:10px;padding:8px 10px;cursor:pointer}
#layerMenu input{width:20px;height:20px;accent-color:var(--accent)}

/* mode banner */
#banner{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--hud-h) + env(safe-area-inset-top,0px) + 10px);z-index:700;background:var(--surface);color:var(--fg);border:1px solid var(--accent);border-radius:6px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);max-width:calc(100vw - 24px);flex-wrap:wrap}
#bannerText{font:600 15px/1.2 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
@media (min-width:900px){#banner{left:calc(50% + 206px)}}

/* flight display */
#hud{position:fixed;left:0;right:0;top:0;z-index:650;background:color-mix(in srgb,var(--surface) 95%,transparent);border-bottom:1px solid var(--line);padding:calc(6px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 7px max(10px,env(safe-area-inset-left,0px));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
@media (min-width:900px){#hud{left:424px}}
.hud-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px 8px}
.hud-row.nav{grid-template-columns:1.35fr 1fr 1fr 1fr;margin-top:5px;padding-top:5px;border-top:1px solid var(--line)}
.cell{display:flex;flex-direction:column;min-width:0}
.cell .k{font:600 11px/1 var(--f-display);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.cell .v{font:clamp(20px,5.4vw,28px)/1.1 var(--f-data);color:var(--data);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .v small{font-size:.5em;color:var(--muted);margin-left:2px}
#h-to{color:var(--route);font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:clamp(19px,5.2vw,26px);letter-spacing:.03em}
.hud-line{display:flex;align-items:center;gap:10px;margin-top:5px;font:13px/1.2 var(--f-data);flex-wrap:wrap}
.xte{display:flex;align-items:center;gap:6px}
.xte-bar{position:relative;width:96px;height:14px;border-radius:2px;background:var(--surface-2);border:1px solid var(--line);
  background-image:linear-gradient(90deg,transparent calc(25% - .5px),var(--line) calc(25% - .5px),var(--line) calc(25% + .5px),transparent calc(25% + .5px),transparent calc(75% - .5px),var(--line) calc(75% - .5px),var(--line) calc(75% + .5px),transparent calc(75% + .5px))}
.xte-bar::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--route)}
.xte-bar i{position:absolute;top:2px;width:8px;height:8px;margin-left:-4px;background:var(--data);left:50%;transition:left .4s;transform:rotate(45deg)}
#h-zone{font:600 13px/1.2 var(--f-display);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.st-ok{color:var(--ok)} .st-warn{color:var(--warn)} .st-danger{color:var(--danger)} .st-muted{color:var(--muted)}

/* mission sheet */
#sheet{position:fixed;z-index:800;left:0;right:0;bottom:0;background:var(--surface);border-top:2px solid var(--accent);border-top-left-radius:10px;border-top-right-radius:10px;box-shadow:0 -6px 28px rgba(0,0,0,.25);display:flex;flex-direction:column;height:48%;transition:height .22s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet[data-state="min"]{height:calc(118px + env(safe-area-inset-bottom,0px))}
#sheet[data-state="full"]{height:calc(100% - 64px - var(--hud-h) - env(safe-area-inset-top,0px))}
.grab{flex:0 0 auto;display:flex;justify-content:center;padding:7px 0 3px;border:0;background:none;width:100%;cursor:pointer}
.grab span{width:46px;height:5px;border-radius:3px;background:var(--line)}
.status{flex:0 0 auto;display:flex;justify-content:space-between;gap:10px;padding:2px max(14px,env(safe-area-inset-right,0px)) 4px max(14px,env(safe-area-inset-left,0px));font:12px/1.2 var(--f-data);color:var(--muted);white-space:nowrap;overflow:hidden}
.status b{color:var(--fg);font-weight:400}
.status .msn{overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.tabs{flex:0 0 auto;display:grid;grid-template-columns:repeat(6,1fr);padding:0 max(4px,env(safe-area-inset-right,0px)) 0 max(4px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.tab{position:relative;border:0;background:none;padding:6px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--muted);font:600 12px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;border-bottom:3px solid transparent;min-height:54px;min-width:0;overflow:hidden;white-space:nowrap}
:root[lang="ru"] .tab{font-size:11px;letter-spacing:0}
.tab svg{width:23px;height:23px;flex:0 0 auto}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--danger);position:absolute;top:6px;right:calc(50% - 18px);animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
#panel{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-block:14px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){
  #sheet,#sheet[data-state]{left:12px;top:12px;bottom:12px;right:auto;width:400px;height:auto;border-radius:8px;border:1px solid var(--line);border-top:2px solid var(--accent);box-shadow:var(--shadow);padding-bottom:0}
  .grab{display:none} .status{padding-top:8px}
}

/* panel content */
.ph{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.ph h2{margin:0;font:700 26px/1.05 var(--f-display);letter-spacing:.04em;text-transform:uppercase;text-wrap:balance}
.ph .sub{color:var(--muted);font:13px var(--f-data)}
.back{border:0;background:none;color:var(--accent);font:600 14px var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:4px 0;margin:0 0 6px;cursor:pointer}
h3{font:600 13px/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h3::after{content:"";flex:1;height:1px;background:var(--line)}
p.note{color:var(--muted);font-size:13.5px;margin:6px 0 10px;max-width:62ch}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:8px 16px;border-radius:5px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font:600 15px/1.05 var(--f-display);letter-spacing:.06em;text-transform:uppercase;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.big{min-height:56px;font-size:17px;flex:1}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.danger.armed,.btn.stop{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{min-height:36px;padding:4px 12px;font-size:13.5px}
.btn:focus-visible,.tab:focus-visible,.row:focus-visible,.fab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.leg:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:default}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list li{border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 2px;border:0;background:none;text-align:left;cursor:pointer;min-height:56px}
.row .sym{flex:0 0 26px;color:var(--fg)} .row .sym.nav{color:var(--nav)}
.row .sym svg{width:24px;height:24px;display:block;overflow:visible}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-main b{font:600 16px/1.2 var(--f-display);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-main small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-side{text-align:right;font:14px var(--f-data);white-space:nowrap;color:var(--data)}
.row-side small{display:block;color:var(--muted);font-size:11px}
.chip{display:inline-block;width:12px;height:12px;background:var(--zc);opacity:.85;flex:0 0 auto}
.badge{display:inline-block;font:600 11px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;padding:3px 6px;border-radius:2px;background:var(--accent);color:var(--accent-fg);margin-left:6px;vertical-align:2px}
.badge.ref{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.empty{color:var(--muted);padding:16px 0;font-size:14px}
.form{display:grid;gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font:600 12px/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;min-height:46px;padding:8px 10px;border-radius:4px;border:1px solid var(--line);background:var(--surface-2);font-size:16px}
.f input.num{font-family:var(--f-data);font-size:18px;color:var(--data)}
.f textarea{min-height:110px;font-family:var(--f-data);font-size:14px;resize:vertical}
.f .hint{font-size:12.5px;color:var(--muted);text-transform:none;letter-spacing:0;font-family:var(--f-body)}
.f .hint.err{color:var(--danger)} .f .hint.okc{color:var(--ok);font-family:var(--f-data)}
.search{position:relative;margin-bottom:12px}
.search input{width:100%;min-height:48px;padding:8px 12px 8px 40px;border-radius:5px;border:1px solid var(--line);background:var(--surface-2);font-size:16px}
.search svg{position:absolute;left:12px;top:14px;width:20px;height:20px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:none;padding:8px 13px;font:600 14px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;min-height:42px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.seg.wide{display:grid;grid-template-columns:repeat(4,1fr);width:100%}
.seg.wide.s2{grid-template-columns:repeat(2,1fr)} .seg.wide.s3{grid-template-columns:repeat(3,1fr)}
.seg.wide button{padding:8px 4px}
.card{border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:var(--surface-2);display:grid;gap:8px}
.result .big{font:20px/1.25 var(--f-data);color:var(--data);word-break:break-word}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-data);text-align:right}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:4px 0 6px}
.sum>div{background:var(--surface-2);padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.sum span{font:600 11px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sum b{font:400 19px/1.15 var(--f-data);color:var(--data);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.leg{padding:7px 8px 8px}.leg-g i{font-size:15px}.leg-h b{font-size:14px}
.sum b{font-size:16px}
.toggle{font-size:13.5px;padding:4px 0}.toggle input{width:18px;height:18px}
.ib{width:34px;height:34px}
.leaflet-popup-content{font-size:13px}
/* home grid */
.hgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
@media (max-width:330px){.hgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ht{aspect-ratio:1/1;max-width:100%;border-radius:7px;border:1px solid var(--g-tbd);background:linear-gradient(var(--tile1),var(--tile2));color:var(--g-kfg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;padding:4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 2px 6px var(--g-shade)}
.ht svg{width:28px;height:28px}
.ht span{font:600 10.5px/1.1 var(--f-display);letter-spacing:.05em;text-transform:uppercase;text-align:center}
.ht.mag svg{color:var(--g-mag)}.ht.cy svg{color:var(--accent)}.ht.grn svg{color:var(--g-val)}.ht.amb svg{color:var(--warn)}
/* field chooser */
#fpick{position:fixed;z-index:900;left:50%;top:calc(var(--hud-h) + 8px);transform:translateX(-50%);width:min(360px,calc(100vw - 20px));background:var(--surface);border:1px solid var(--accent);border-radius:6px;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#fpick button{min-height:34px;border:1px solid var(--g-kbd);border-radius:4px;background:linear-gradient(var(--g-k1),var(--g-k2));color:var(--g-kfg);font:600 11px var(--f-display);letter-spacing:.06em;text-transform:uppercase}
#fpick button.on{border-color:var(--accent);color:var(--g-hi)}
#fpick .ttl{grid-column:1/-1;font:600 11px var(--f-display);letter-spacing:.12em;color:var(--g-lbl);text-transform:uppercase}
/* map overlays */
.rring{stroke:var(--fg);stroke-width:1.2;fill:none;opacity:.7;stroke-dasharray:2 5}
.rring-lbl{font:600 11px var(--f-data);color:#fff;background:rgba(0,0,0,.65);padding:1px 4px;border-radius:2px;transform:translate(-50%,-50%);display:inline-block;white-space:nowrap}
.tvec{stroke:var(--fg);stroke-width:2;fill:none;stroke-dasharray:6 4;opacity:.9}
.ac-ico svg{filter:drop-shadow(0 0 1.5px #000) drop-shadow(0 2px 3px rgba(0,0,0,.6))}
/* 3D view */
#v3d{position:fixed;left:0;right:0;top:var(--hud-h);bottom:calc(var(--soft-h) + var(--nav-h));z-index:645;background:#000}
#v3d-c{width:100%;height:100%;display:block;touch-action:none}
#v3d-ui{position:absolute;inset:0;pointer-events:none}
#v3d-ui .grp{position:absolute;display:flex;gap:4px;pointer-events:auto}
#v3d-ui .tr{top:8px;right:8px}
#v3d-ui .bl{left:8px;bottom:8px}
#v3d-ui button{min-height:30px;min-width:34px;padding:0 8px;border-radius:4px;border:1px solid var(--g-kbd);background:rgba(20,27,36,.85);color:var(--g-kfg);font:600 11px var(--f-display);letter-spacing:.06em}
#v3d-ui button.on{border-color:var(--accent);color:var(--g-hi)}
/* tidier icons: labels always stay inside their key or tile */
.sk{padding:2px 1px;overflow:hidden}
.sk span{font-size:8.5px;letter-spacing:.02em;max-width:calc(100% - 2px);text-overflow:ellipsis}
.sk svg{width:18px;height:18px;flex:0 0 auto}
.sk .dto{font-size:14px}
.ht{padding:6px 3px;overflow:hidden;gap:5px;aspect-ratio:auto;min-height:72px}
.ht svg{width:24px;height:24px;flex:0 0 auto}
.ht span{font-size:9.5px;letter-spacing:.01em;line-height:1.12;max-width:100%;overflow-wrap:normal;hyphens:manual;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fab{overflow:hidden;font-size:10.5px;letter-spacing:.02em}
.gk{white-space:nowrap;overflow:hidden;max-width:46%}
.gf .k{text-overflow:ellipsis}
/* day theme: clearer panels on bright background */
:root[data-theme="light"] #sheet{box-shadow:0 -4px 18px rgba(20,40,80,.18)}
:root[data-theme="light"] .leaflet-popup-content-wrapper{box-shadow:0 4px 16px rgba(20,40,80,.25)}
:root[data-theme="light"] .sk{box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(20,40,80,.15)}
.l39b{fill:#e4e9ee;stroke:#0a1428;stroke-width:.11;stroke-linejoin:round}
.l39c{fill:#1d4f6b;stroke:#0a1428;stroke-width:.07}
.l39l{fill:none;stroke:#59636d;stroke-width:.06;stroke-linecap:round}

/* track-up map */
body.tu #map{transition:transform .8s linear;transform-origin:50% 50%}
body.tu .pt-lbl{transform:rotate(var(--unrot,0deg));transform-origin:-12px 9px}
body.tu .leg-lbl,body.tu .zone-lbl,body.tu .meas-lbl,body.tu .rring-lbl{transform:translate(-50%,-50%) rotate(var(--unrot,0deg))}
body.tu .leaflet-popup-content-wrapper{transform:rotate(var(--unrot,0deg));transform-origin:50% calc(100% + 18px)}
body.tu .leaflet-popup-tip-container{visibility:hidden}
body.tu .leaflet-control-container{display:none}
#fabOri svg{width:20px;height:20px}
.lm-fb{display:block;font-size:10.5px;color:var(--muted);font-weight:400;margin-top:2px}
.ovl-hs{mix-blend-mode:multiply}
:root[data-theme="dark"] .gf .v,:root[data-theme="dark"] .cell .v{text-shadow:0 0 6px rgba(94,224,255,.28)}
:root[data-theme="dark"] #hud{border-bottom:1px solid #1f4a86;box-shadow:0 1px 0 rgba(63,182,255,.18),0 6px 18px rgba(0,0,0,.45)}
:root[data-theme="dark"] #gsoft{border-top:1px solid #1f4a86;box-shadow:0 -1px 0 rgba(63,182,255,.15)}
:root[data-theme="dark"] .sk.on,:root[data-theme="dark"] .fab.on{box-shadow:0 0 10px rgba(63,182,255,.45),inset 0 1px 0 rgba(255,255,255,.15)}
:root[data-theme="dark"] #sheet{border-top-color:#2a6fc4;box-shadow:0 -8px 30px rgba(0,8,30,.6)}
:root[data-theme="dark"] .ht{box-shadow:inset 0 1px 0 rgba(140,190,255,.12),0 2px 8px rgba(0,0,0,.5)}
#tuAttr{position:fixed;right:4px;bottom:calc(var(--soft-h) + var(--nav-h) + 2px);z-index:630;font-size:9px;color:var(--muted);background:color-mix(in srgb,var(--surface) 75%,transparent);padding:1px 4px;border-radius:2px;pointer-events:none}

const AB={EN:{MC:'MC',TC:'TC',MH:'MH',WCA:'WCA',GS:'GS',TAS:'TAS',ETE:'ETE',ETA:'ETA',MSA:'MSA',DIST:'Dist',ALT:'Alt',BRG:'Brg',TRK:'Trk',XTE:'XTE',TO:'To',VAR:'Var',W:'W',FUEL:'Fuel',ETAD:'ETA dest',TERR:'terrain',M:'M',T:'T',TOTAL:'Total'},
          RU:{MC:'МПУ',TC:'ИПУ',MH:'МК',WCA:'УС',GS:'W',TAS:'V',ETE:'t',ETA:'Приб.',MSA:'Hбез',DIST:'S',ALT:'H',BRG:'ЗМПУ',TRK:'ФМПУ',XTE:'ЛБУ',TO:'ППМ',VAR:'ΔM',W:'Ветер',FUEL:'топл.',ETAD:'Приб. конеч.',TERR:'рельеф',M:'М',T:'И',TOTAL:'Итого'}};
const UL={EN:{km:'km',m:'m',NM:'NM',ft:'ft',kmh:'km/h',kt:'kt',mps:'m/s',kg:'kg',lb:'lb'},RU:{km:'км',m:'м',NM:'NM',ft:'фут',kmh:'км/ч',kt:'уз',mps:'м/с',kg:'кг',lb:'фунт'}};
const L10=()=>CFG.lang==='ru'?'RU':'EN';
function t(s,o){ let r=(CFG.lang==='ru'&&RU[s]!=null)?RU[s]:s; if(o) r=r.replace(/\{(\w+)\}/g,(m,k)=>o[k]!=null?o[k]:m); return r; }
const ab=k=>AB[L10()][k];
const ul=u=>UL[L10()][u]||u;

/* ================= geodesy (WGS-84, Vincenty) ================= */
const A=6378137, F=1/298.257223563, B=A*(1-F), R=6371008.8;
function sphInverse(la1,lo1,la2,lo2){
  const p1=rad(la1),p2=rad(la2),dl=rad(lo2-lo1);
  const d=2*Math.asin(Math.sqrt(Math.sin((p2-p1)/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2));
  const y=Math.sin(dl)*Math.cos(p2), x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
  return {dist:d*R, az1:n360(deg(Math.atan2(y,x)))};
}
function inverse(la1,lo1,la2,lo2){
  const L=rad(nLon(lo2-lo1));
  const U1=Math.atan((1-F)*Math.tan(rad(la1))), U2=Math.atan((1-F)*Math.tan(rad(la2)));
  const sU1=Math.sin(U1),cU1=Math.cos(U1),sU2=Math.sin(U2),cU2=Math.cos(U2);
  let l=L,lp,it=0,sS,cS,S,sa,c2a,c2m,sl,cl;
  do{
    sl=Math.sin(l);cl=Math.cos(l);
    sS=Math.sqrt((cU2*sl)**2+(cU1*sU2-sU1*cU2*cl)**2);
    if(sS===0) return {dist:0,az1:0};
    cS=sU1*sU2+cU1*cU2*cl; S=Math.atan2(sS,cS);
    sa=cU1*cU2*sl/sS; c2a=1-sa*sa;
    c2m=c2a!==0?cS-2*sU1*sU2/c2a:0;
    const C=F/16*c2a*(4+F*(4-3*c2a));
    lp=l; l=L+(1-C)*F*sa*(S+C*sS*(c2m+C*cS*(-1+2*c2m*c2m)));
  }while(Math.abs(l-lp)>1e-12&&++it<200);
  if(it>=200) return sphInverse(la1,lo1,la2,lo2);
  const u2=c2a*(A*A-B*B)/(B*B);
  const AA=1+u2/16384*(4096+u2*(-768+u2*(320-175*u2)));
  const BB=u2/1024*(256+u2*(-128+u2*(74-47*u2)));
  const dS=BB*sS*(c2m+BB/4*(cS*(-1+2*c2m*c2m)-BB/6*c2m*(-3+4*sS*sS)*(-3+4*c2m*c2m)));
  return {dist:B*AA*(S-dS), az1:n360(deg(Math.atan2(cU2*sl,cU1*sU2-sU1*cU2*cl)))};
}
function direct(la1,lo1,az,s){
  const a1=rad(az),sa1=Math.sin(a1),ca1=Math.cos(a1);
  const tU1=(1-F)*Math.tan(rad(la1)),cU1=1/Math.sqrt(1+tU1*tU1),sU1=tU1*cU1;
  const s1=Math.atan2(tU1,ca1), sa=cU1*sa1, c2a=1-sa*sa;
  const u2=c2a*(A*A-B*B)/(B*B);
  const AA=1+u2/16384*(4096+u2*(-768+u2*(320-175*u2)));
  const BB=u2/1024*(256+u2*(-128+u2*(74-47*u2)));
  let S=s/(B*AA),Sp,c2m,sS,cS,it=0;
  do{ c2m=Math.cos(2*s1+S);sS=Math.sin(S);cS=Math.cos(S);
    const dS=BB*sS*(c2m+BB/4*(cS*(-1+2*c2m*c2m)-BB/6*c2m*(-3+4*sS*sS)*(-3+4*c2m*c2m)));

function parseCoord(str){
  if(!str) return null;
  let s=String(str).toUpperCase().trim()
    .replace(/С/g,'N').replace(/Ю/g,'S').replace(/В/g,'E').replace(/З/g,'W')   /* Russian hemisphere letters */
    .replace(/(\d),(\d)/g,(m,a,b)=>a+'.'+b)
    .replace(/[°º'′’"″”;,/:]/g,' ')
    .replace(/\s+/g,' ');
  const toks=s.match(/[NSEW]|[-+]?\d+(?:\.\d+)?/g);
  if(!toks) return null;
  let latH=null,lonH=null; const nums=[]; let split=-1;
  toks.forEach(tk=>{
    if(tk==='N'||tk==='S'){latH=tk; if(nums.length&&split<0&&lonH===null) split=nums.length;}
    else if(tk==='E'||tk==='W'){lonH=tk; if(split<0&&nums.length) split=nums.length;}
    else nums.push(tk);
  });
  const leadIdx=toks.findIndex(tk=>tk==='E'||tk==='W');
  if(/^[NS]/.test(toks[0])&&leadIdx>0) split=toks.slice(0,leadIdx).filter(tk=>!/[NSEW]/.test(tk)).length;
  if(split<=0||split>=nums.length){ if(nums.length%2) return null; split=nums.length/2; }
  const la=toDeg(nums.slice(0,split),true), lo=toDeg(nums.slice(split),false);
  if(la==null||lo==null) return null;
  let lat=la, lon=lo;
  if(latH==='S') lat=-Math.abs(lat); if(lonH==='W') lon=-Math.abs(lon);
  if(Math.abs(lat)>90||Math.abs(lon)>180) return null;
  return {lat,lon};
}

async function fetchElevations(pts){
  const out=new Array(pts.length).fill(null);
  for(let i=0;i<pts.length;i+=100){
    const ch=pts.slice(i,i+100); let res=null;
    try{
      const u='https://api.open-meteo.com/v1/elevation?latitude='+ch.map(p=>p[0].toFixed(5)).join(',')+'&longitude='+ch.map(p=>p[1].toFixed(5)).join(',');
      const r=await fetch(u); if(r.ok){const j=await r.json(); if(Array.isArray(j.elevation)) res=j.elevation;}
    }catch(e){}
    if(!res){ try{
      const r=await fetch('https://api.opentopodata.org/v1/srtm90m?locations='+ch.map(p=>p[0].toFixed(5)+','+p[1].toFixed(5)).join('|'));
      if(r.ok){const j=await r.json(); res=(j.results||[]).map(x=>x.elevation);}
    }catch(e){} }
    if(res) res.forEach((v,k)=>{out[i+k]=(typeof v==='number'&&isFinite(v))?v:null});
  }
  return out;
}

  try{ const r=await fetch(u); if(!r.ok) return null; const j=await r.json(); const v=j&&j.result&&j.result[0]&&j.result[0].declination; return (typeof v==='number'&&isFinite(v))?Math.round(v*10)/10:null; }catch(e){ return null; }
}

async function flushElev(){

const TileDB={db:null,
  open(){ if(this.db) return Promise.resolve(this.db); return new Promise((res,rej)=>{ try{ const r=indexedDB.open('fmn-tiles',1); r.onupgradeneeded=()=>r.result.createObjectStore('t'); r.onsuccess=()=>{this.db=r.result;res(r.result)}; r.onerror=()=>rej(r.error);}catch(e){rej(e)} }); },
  async get(k){ try{ const db=await this.open(); return await new Promise(res=>{const q=db.transaction('t').objectStore('t').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);}); }catch(e){return null} },
  async put(k,v){ try{ const db=await this.open(); await new Promise(res=>{const tx=db.transaction('t','readwrite');tx.objectStore('t').put(v,k);tx.oncomplete=res;tx.onerror=res;}); return true;}catch(e){return false} },
  async count(){ try{ const db=await this.open(); return await new Promise(res=>{const q=db.transaction('t').objectStore('t').count();q.onsuccess=()=>res(q.result);q.onerror=()=>res(0);}); }catch(e){return 0} },

const CachedLayer=L.TileLayer.extend({
  createTile(c,done){
    const img=document.createElement('img'); img.alt=''; img.setAttribute('role','presentation');
    L.DomEvent.on(img,'load',L.Util.bind(this._tileOnLoad,this,done,img));
    const key=`${this.options.key}/${c.z}/${c.x}/${c.y}`, fbk=(this.options.fb||[]).filter(k=>tileUrl(LAYERS[k],c));
    const urls=[this.getTileUrl(c),...fbk.map(k=>tileUrl(LAYERS[k],c))]; let i=0;
    /* on error try the backup sources for the same tile before giving up */
    img.addEventListener('error',e=>{ e.stopImmediatePropagation(); i++; if(i<urls.length){ img.src=urls[i]; } else this._tileOnError(done,img,e); },true);
    img.addEventListener('load',()=>{ if(this.options.fb) tileHealth(this,i,fbk[i-1]); },true);
    TileDB.get(key).then(b=>{ if(b){ const u=URL.createObjectURL(b); img.addEventListener('load',()=>URL.revokeObjectURL(u),{once:true}); i=-1; img.src=u; } else img.src=urls[0]; });
    return img;
  }
});

const FLY={routeId:null,leg:1,target:null,direct:null,gps:false,watch:null,sim:false,simT:null,simMult:1,simState:null,follow:true,hud:true,pos:null,hist:[],gs:null,trk:null,zonesIn:new Set(),wake:null,lastTrk:0,nav:null};

/* GPS: quick coarse fix first, then high-accuracy tracking with filtering; a watchdog restarts the receiver if fixes stop */
function gpsWatch(){ if(FLY.watch!=null) navigator.geolocation.clearWatch(FLY.watch); FLY.watchT=Date.now();
  FLY.watch=navigator.geolocation.watchPosition(onGpsFix,onGpsErr,{enableHighAccuracy:true,maximumAge:0,timeout:15000}); }
function onGpsErr(err){ if(err.code===1){ toast('GPS: '+t('Location permission refused. Allow location for this page in the browser settings.'),true); stopGPS(); return; }
  if(err.code!==3){ FLY.gpsErr=err.message; renderStatus(); } }
function onGpsFix(p){ if(!FLY.gps) return; const c=p.coords, now=p.timestamp||Date.now();
  const fx={lat:c.latitude,lon:c.longitude,alt:c.altitude!=null?c.altitude+(+CFG.altCorr||0):null,spd:(c.speed!=null&&isFinite(c.speed)&&c.speed>=0)?c.speed:null,
    trk:(c.heading!=null&&isFinite(c.heading)&&c.speed>1.5)?c.heading:null,acc:c.accuracy||999,t:now};
  const last=FLY.pos&&!FLY.pos.sim?FLY.pos:null;
  if(last){ if(now<=last.t) return;
    const dt=(now-last.t)/1000, d=inverse(last.lat,last.lon,fx.lat,fx.lon).dist;
    /* a coarse network fix right after a good satellite fix is ignored */

    /* an impossible jump (over ~1200 kt) is ignored unless it repeats */
    if((d-fx.acc-last.acc)/Math.max(dt,.5)>620&&(FLY.gpsJump=(FLY.gpsJump||0)+1)<3) return;
    FLY.gpsJump=0;

  }

  ingest(fx);

/* device compass turns the aircraft symbol while standing still (track is unknown below walking speed) */
function compassOn(){ if(FLY.cmpOn) return;
  const h=e=>{ let v=null; if(e.webkitCompassHeading!=null&&isFinite(e.webkitCompassHeading)) v=e.webkitCompassHeading; else if(e.absolute&&e.alpha!=null) v=360-e.alpha; if(v==null) return;
    const so=(screen.orientation&&screen.orientation.angle)||window.orientation||0; FLY.hdgDev=n360(v+so+curVar()); FLY.hdgDevT=Date.now();
    const n=Date.now(); if(acMarker&&FLY.pos&&!FLY.sim&&(FLY.gs==null||FLY.gs<3)&&n-(FLY.cmpDraw||0)>250){ FLY.cmpDraw=n; acMarker.setIcon(acIcon(FLY.hdgDev)); } };
  const go=()=>{ FLY.cmpOn=true; if('ondeviceorientationabsolute' in window) window.addEventListener('deviceorientationabsolute',h); else window.addEventListener('deviceorientation',h); };
  try{ if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function') DeviceOrientationEvent.requestPermission().then(r=>{ if(r==='granted') go(); }).catch(()=>{}); else if(window.DeviceOrientationEvent) go(); }catch(e){} }
function icoHdg(trk){ return (FLY.gs==null||FLY.gs<3)&&FLY.hdgDev!=null&&Date.now()-FLY.hdgDevT<3000&&!FLY.sim?FLY.hdgDev:trk; }
function gpsBadge(){ if(FLY.sim) return '<b class="st-warn">SIM</b>'; if(!FLY.gps) return 'GPS —';
  if(FLY.gpsLost) return `<b class="st-danger">${t('GPS LOST')}</b>`; if(!FLY.pos||!FLY.lastFix) return `<b class="st-warn">GPS …</b>`;
  const a=FLY.pos.sacc||FLY.pos.acc; return `<b class="${a<=20?'st-ok':a<=60?'st-warn':'st-danger'}">GPS ±${Math.round(altOutM(a))}${ul(CFG.alt==='ft'?'ft':'m')}</b>`; }
const altOutM=m=>CFG.alt==='ft'?m/M_FT:m;
function startGPS(){
  if(!navigator.geolocation){toast(t('This browser has no location access.'),true);return;}
  stopSim(); FLY.gps=true; FLY.hist=[]; FLY.lastFix=0; FLY.gpsLost=false; FLY.gpsJump=0;
  compassOn();
  navigator.geolocation.getCurrentPosition(p=>{ if(FLY.gps&&!FLY.lastFix) onGpsFix(p); },()=>{},{enableHighAccuracy:false,maximumAge:120000,timeout:8000});
  gpsWatch();
  clearInterval(FLY.dogT); FLY.dogT=setInterval(()=>{ if(!FLY.gps) return; const age=Date.now()-(FLY.lastFix||FLY.watchT);
    const lost=!!FLY.lastFix&&age>12000; if(lost!==!!FLY.gpsLost){ FLY.gpsLost=lost; renderStatus(); if(lost) toast(t('GPS signal lost — searching…'),true); }
    if(age>20000&&Date.now()-FLY.watchT>20000) gpsWatch(); },4000);
  wake(true); toast(t('GPS on — waiting for fix')); renderPanel(); renderStatus(); showHud();
}
function stopGPS(){ if(FLY.watch!=null) navigator.geolocation.clearWatch(FLY.watch); clearInterval(FLY.dogT); FLY.watch=null; FLY.gps=false; FLY.gpsLost=false; wake(false); renderPanel(); renderStatus(); }
function startSim(){
  const r=Rt(FLY.routeId), pts=routePts(r); if(pts.length<2){toast(t('Activate a route with at least two waypoints.'));return;}
  if(FLY.gps) stopGPS(); FLY.sim=true; FLY.leg=1; FLY.direct=null; FLY.simState={leg:1,along:0}; FLY.hist=[];
  const tick=()=>{ const r=Rt(FLY.routeId), pts=routePts(r); if(pts.length<2){stopSim();return;}
    const st=FLY.simState;
    let a=pts[st.leg-1],b=pts[st.leg],inv=inverse(a.lat,a.lon,b.lat,b.lon), lp=legParams(r,st.leg-1), w=windTri(inv.az1,lp.tas,lp.wd,lp.ws);
    const gs=(w.gs||lp.tas||100); st.along+=gs*FLY.simMult;
    while(st.along>inv.dist){ st.along-=inv.dist; st.leg++; if(st.leg>=pts.length){st.leg=1;st.along=0;FLY.leg=1;} a=pts[st.leg-1];b=pts[st.leg];inv=inverse(a.lat,a.lon,b.lat,b.lon); lp=legParams(r,st.leg-1); }
    const p=direct(a.lat,a.lon,inv.az1,st.along), trk=inverse(p.lat,p.lon,b.lat,b.lon).az1;
    ingest({lat:p.lat,lon:p.lon,alt:lp.alt,spd:gs,trk,acc:5,t:Date.now(),sim:true}); };
  tick(); FLY.simT=setInterval(tick,1000); wake(true); showHud(); renderPanel(); renderStatus();
}
function stopSim(){ clearInterval(FLY.simT); FLY.simT=null; if(FLY.sim){FLY.sim=false;wake(false);} renderPanel(); renderStatus(); }
async function wake(on){ try{ if(on&&navigator.wakeLock&&!FLY.wake){FLY.wake=await navigator.wakeLock.request('screen');FLY.wake.addEventListener('release',()=>{FLY.wake=null});} if(!on&&FLY.wake){await FLY.wake.release();FLY.wake=null;} }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&(FLY.gps||FLY.sim)){ wake(true); if(FLY.gps) gpsWatch(); } });
/* ground speed and track averaged over the last ~10 s, so ETAs follow the real speed without jitter */
function ingest(fx){
  FLY.hist.push(fx); while(FLY.hist.length>2&&fx.t-FLY.hist[0].t>10000) FLY.hist.shift();
  const h0=FLY.hist[0], span=(fx.t-h0.t)/1000;
  let gs=null,trk=null;
  if(!fx.sim&&span>=3){ const d=inverse(h0.lat,h0.lon,fx.lat,fx.lon); gs=d.dist/span; if(d.dist>20) trk=d.az1; }
  if(!fx.sim&&fx.trk!=null) trk=fx.trk;
  if(gs==null) gs=fx.spd; if(trk==null) trk=fx.trk!=null?fx.trk:FLY.trk;
  if(gs!=null&&fx.spd!=null&&!fx.sim) gs=fx.spd*.75+gs*.25;
  FLY.gs=gs; FLY.trk=trk; FLY.pos=fx;
  if(!FLY.lastTrk||fx.t-FLY.lastTrk>4000){ MS.track.push([+fx.lat.toFixed(6),+fx.lon.toFixed(6),fx.alt!=null?Math.round(fx.alt):null,fx.t]); if(MS.track.length>20000)MS.track.shift(); FLY.lastTrk=fx.t; if(!fx.sim)save(); }
  const ll=[fx.lat,fx.lon];
  if(!acMarker){ acMarker=L.marker(ll,{icon:acIcon(icoHdg(trk)),interactive:false,zIndexOffset:1000}).addTo(gAc); accCircle=L.circle(ll,{radius:fx.sacc||fx.acc||0,className:'acc-circle',interactive:false}).addTo(gAc); }
  else { acMarker.setLatLng(ll); acMarker.setIcon(acIcon(icoHdg(trk))); accCircle.setLatLng(ll); accCircle.setRadius(fx.sacc||fx.acc||0); }
  drawTrack(); drawOwnship();
  applyTU(); if(FLY.follow) followPan(ll);
  navUpdate();
}
function drawTrack(){ if(!trkLine){trkLine=L.polyline([],{className:'trk',weight:2.5,interactive:false}).addTo(gTrack);} trkLine.setLatLngs(MS.track.slice(-3000).map(x=>[x[0],x[1]])); }
function navUpdate(){
  const p=FLY.pos; if(!p){updHud();return;}
  const r=Rt(FLY.routeId), pts=routePts(r), legs=r?routeLegs(r):[], gs=FLY.gs; let tgt=null, from=null;
  if(FLY.direct){ tgt=P(FLY.direct.id); from=FLY.direct.from; }
  else if(pts.length>=2){ FLY.leg=clamp(FLY.leg,1,pts.length-1); tgt=pts[FLY.leg]; from=pts[FLY.leg-1]; }
  else if(pts.length===1) tgt=pts[0];
  if(FLY.obs!=null&&tgt){ const q=direct(tgt.lat,tgt.lon,n360(FLY.obs+curVar()+180),200000); from={lat:q.lat,lon:q.lon,name:'OBS'}; }
  const nav={tgt,from,live:[],obs:FLY.obs};
  if(tgt){ const inv=inverse(p.lat,p.lon,tgt.lat,tgt.lon); nav.brg=inv.az1; nav.dist=inv.dist;
    nav.ete=gs>5?inv.dist/gs:null; nav.eta=nav.ete!=null?new Date(Date.now()+nav.ete*1000):null;
    if(from){ const x=xtrack(from,tgt,p); nav.xte=x.xte; nav.dtk=FLY.obs!=null?n360(FLY.obs+curVar()):sphInverse(from.lat,from.lon,tgt.lat,tgt.lon).az1; nav.toFrom=x.along>x.legLen?'FROM':'TO';
      /* turn info for the crew: angle, new course, bank and speed for the next leg (straight-leg route, no lead) */
      const nxt=(!FLY.direct&&FLY.leg<pts.length-1)?pts[FLY.leg+1]:null;
      if(nxt){ const ta=turnAngle(from,tgt,nxt), lp=legParams(r,FLY.leg-1), ln=legParams(r,FLY.leg);
        if(Math.abs(ta.ur)>=1) nav.turn={ur:ta.ur,mc:n360(ta.outC-curVar()),bank:lp.bank,tas:ln.tas,alt:ln.alt,tTo:gs>5?inv.dist/gs:null}; }
      { const lp=legParams(r||{},FLY.leg-1); nav.plan_tas=lp.tas; nav.plan_alt=lp.alt; }
      const arrived=FLY.obs==null&&(inv.dist<(CFG.arrM||1500)||x.along>x.legLen);
      if(arrived){ if(FLY.direct){ const i=pts.findIndex(q=>q.id===tgt.id); FLY.direct=null; if(i>=0&&i<pts.length-1){FLY.leg=i+1; toast(t('Passed {a} — next {b}',{a:tgt.name,b:pts[FLY.leg].name}));} }
        else if(FLY.leg<pts.length-1){ FLY.leg++; toast(nav.turn?t('Turn {d} to {m} — next {b}',{d:nav.turn.ur>0?ab('RIGHT'):ab('LEFT'),m:ab('MC')+' '+fmtBrg(nav.turn.mc)+', '+t('bank {b}°',{b:nav.turn.bank}),b:pts[FLY.leg].name}):t('Passed {a} — next {b}',{a:tgt.name,b:pts[FLY.leg].name})); if(navigator.vibrate)navigator.vibrate(120); nav.turn=null; if(VIEW.tab==='fly')renderPanel(); } } }
    const ti=pts.findIndex(q=>q.id===tgt.id);
    if(gs>5&&ti>=0){ let rem=inv.dist; nav.live[ti]=new Date(Date.now()+rem/gs*1000);
      for(let i=ti+1;i<pts.length;i++){ rem+=legs[i-1].dist; nav.live[i]=new Date(Date.now()+rem/gs*1000); }
      nav.remain=rem; nav.etaDest=nav.live[pts.length-1]; }
    if(ti>0&&legs[ti-1]&&legs[ti-1].eta){ const plan=legs[ti-1].eta; nav.plan=plan; if(nav.eta) nav.delta=(nav.eta-plan)/1000;
      const left=(plan-Date.now())/1000; nav.reqGs=left>5?inv.dist/left:null; }
  }
  if(FLY.target!==tgt){ FLY.target=tgt; renderMap(); }
  if(!goLine) goLine=L.polyline([],{className:'gotoline',weight:2.5,interactive:false}).addTo(gTrack);
  goLine.setLatLngs(tgt?densify(p,tgt,5000):[]);
  nav.zone=zoneStatus(p);
  FLY.nav=nav; updHud();
  if(VIEW.tab==='fly') updFlyLive();
}
function zoneStatus(p){
  const res={inside:[],near:[]}, alertM=CFG.alertM||4000;
  allZones().filter(z=>BAD.has(z.type)||isVis(z)).forEach(z=>{ let ins,edge;
    if(z.kind==='circle'){ const d=inverse(z.lat,z.lon,p.lat,p.lon).dist; ins=d<=z.r; edge=Math.abs(z.r-d); }
    else { if(!z.coords||z.coords.length<3) return; ins=inPoly(p,z.coords); edge=Infinity; for(let i=0;i<z.coords.length;i++) edge=Math.min(edge,segDist(p,z.coords[i],z.coords[(i+1)%z.coords.length])); }
    if(z.type==='C'&&!ins) return;
    if(ins) res.inside.push({z,edge}); else if(edge<alertM) res.near.push({z,edge}); });
  res.inside.sort((a,b)=>(BAD.has(b.z.type)?1:0)-(BAD.has(a.z.type)?1:0));
  const now=new Set(res.inside.map(x=>x.z.id));
  res.inside.forEach(({z})=>{ if(!FLY.zonesIn.has(z.id)){ const bad=BAD.has(z.type); if(z.type!=='C') toast(t('Entered {z} ({t})',{z:z.name,t:ZTN(z.type)}),bad); if(bad&&navigator.vibrate)navigator.vibrate([200,100,200]); } });
  FLY.zonesIn.forEach(id=>{ if(!now.has(id)){ const z=Zn(id); if(z&&z.type!=='C') toast(t('Left {z}',{z:z.name}), z.type==='TRN'||z.type==='EXR'); } });
  FLY.zonesIn=now; return res;
}

function catItems(){
  const q=(VIEW.q||'').trim().toLowerCase();
  if(VIEW.cat==='routes') return MS.routes.filter(r=>matchQ(r,q));
  if(VIEW.cat==='zones') return MS.zones.filter(z=>matchQ(z,q)).concat(q?LIB.zones.filter(z=>matchQ(z,q)):[]);
  const f=VIEW.pf, src=f==='mine'?MS.points:f==='nav'?LIB.points.filter(isNav):f==='wpt'?LIB.points.filter(p=>!isNav(p)):MS.points.concat(LIB.points);
  const ref=FLY.pos||(map.getCenter?(c=>({lat:c.lat,lon:c.lng}))(map.getCenter()):null);
  const byD=(a,b)=>inverse(ref.lat,ref.lon,a.lat,a.lon).dist-inverse(ref.lat,ref.lon,b.lat,b.lon).dist;
  return src.filter(p=>matchQ(p,q)).sort(VIEW.sort==='dist'&&ref?byD:(a,b)=>typeOrder(a.type)-typeOrder(b.type)||a.name.localeCompare(b.name)).slice(0,300);

function drawProfile(){
  const r=Rt(VIEW.id), c=$('#profile'); if(!r||!c||!r.profile) return;
  const dpr=window.devicePixelRatio||1, W=c.clientWidth, H=c.clientHeight; if(!W) return; c.width=W*dpr; c.height=H*dpr;
  const g=c.getContext('2d'); g.scale(dpr,dpr); const cs=getComputedStyle(document.documentElement), col=k=>cs.getPropertyValue(k).trim();
  const pr=r.profile.pts, tot=pr[pr.length-1].d||1, legs=routeLegs(r);
  const alts=legs.map(l=>l.alt).filter(a=>a!=null);
  const maxE=Math.max(...pr.map(p=>p.e??0),...alts,0)*1.15+60, minE=0;
  const pl=46,prr=10,pt=18,pb=22, x=d=>pl+d/tot*(W-pl-prr), y=e=>pt+(1-(e-minE)/(maxE-minE))*(H-pt-pb);
  const CLR=300, CAUT=600; /* m of terrain clearance: red below 300 m, amber below 600 m */
  g.font='11px '+col('--f-data'); g.fillStyle=col('--muted'); g.strokeStyle=col('--line'); g.lineWidth=1; g.setLineDash([2,4]);
  const step=niceStep(altOut(maxE)/4);
  for(let a=0;altIn(a)<=maxE;a+=step){ const yy=y(altIn(a)); g.beginPath();g.moveTo(pl,yy);g.lineTo(W-prr,yy);g.stroke(); g.fillText(String(Math.round(a)),4,yy+4); }
  g.setLineDash([]);
  const uu=ul(CFG.alt); g.fillText(uu,W-prr-g.measureText(uu).width,11);
  /* terrain: filled with a vertical gradient, outlined in the data colour */
  const grd=g.createLinearGradient(0,pt,0,H-pb); grd.addColorStop(0,col('--nav')); grd.addColorStop(1,col('--surface-2'));
  g.beginPath(); g.moveTo(x(0),y(minE)); pr.forEach(p=>g.lineTo(x(p.d),y(p.e??0))); g.lineTo(x(tot),y(minE)); g.closePath();
  g.fillStyle=grd; g.globalAlpha=.55; g.fill(); g.globalAlpha=1;
  g.strokeStyle=col('--data'); g.lineWidth=1.5; g.beginPath(); pr.forEach((p,i)=>i?g.lineTo(x(p.d),y(p.e??0)):g.moveTo(x(p.d),y(p.e??0))); g.stroke();
  /* clearance warnings along each leg with a planned altitude */
  let c0=0; const lb=[];
  legs.forEach(l=>{ if(l.alt!=null){ let minC=Infinity;
      for(let i=1;i<pr.length;i++){ const p0=pr[i-1],p1=pr[i]; if(p1.d<c0||p0.d>l.cum) continue; const e=Math.max(p0.e??0,p1.e??0), cl=l.alt-e; minC=Math.min(minC,cl);
        if(cl<CAUT){ g.strokeStyle=cl<CLR?col('--danger'):col('--warn'); g.lineWidth=3; g.beginPath(); g.moveTo(x(p0.d),y(p0.e??0)); g.lineTo(x(p1.d),y(p1.e??0)); g.stroke(); } }
      lb.push({x0:x(c0),x1:x(l.cum),alt:l.alt,minC}); }
    c0=l.cum; });
  /* planned altitude per leg */
  g.strokeStyle=col('--route'); g.lineWidth=2.2; g.font='600 10.5px '+col('--f-data');
  lb.forEach(o=>{ g.beginPath(); g.moveTo(o.x0,y(o.alt)); g.lineTo(o.x1,y(o.alt)); g.stroke();
    if(o.x1-o.x0>54){ const tx=String(Math.round(altOut(o.alt))); g.fillStyle=col('--route'); g.fillText(tx,o.x0+4,y(o.alt)-4); } });
  /* highest terrain */
  let hi=pr[0]; pr.forEach(p=>{ if((p.e??0)>(hi.e??0)) hi=p; });
  if(hi&&hi.e!=null){ const hx=x(hi.d),hy=y(hi.e); g.fillStyle=col('--warn'); g.beginPath(); g.moveTo(hx,hy-9); g.lineTo(hx-5,hy-2); g.lineTo(hx+5,hy-2); g.closePath(); g.fill();
    const tx=String(Math.round(altOut(hi.e))); g.font='600 10.5px '+col('--f-data'); g.fillText(tx,clamp(hx-g.measureText(tx).width/2,pl,W-prr-g.measureText(tx).width),hy-12); }

async function sampleTerrain(r,quiet){

  for(let i=1;i<el.length;i++){ if(legIdx[i]!==legIdx[i-1]&&el[i-1]!=null){ const L_=legIdx[i]; legMax[L_]=legMax[L_]==null?el[i-1]:Math.max(legMax[L_],el[i-1]); } }

function parseAipZone(txt){
  const s=txt.toUpperCase().replace(/(\d["″”']?\s*)С(?![А-Я])/g,'$1N').replace(/(\d["″”']?\s*)Ю(?![А-Я])/g,'$1S').replace(/(\d["″”']?\s*)В(?![А-Я])/g,'$1E').replace(/(\d["″”']?\s*)З(?![А-Я])/g,'$1W').replace(/(\d),(\d)/g,'$1.$2');
  const coords=[], re=/(\d{4,6}(?:\.\d+)?)\s*([NS])\s*[,;\s]*(\d{5,7}(?:\.\d+)?)\s*([EW])|(\d{1,2})\s*°\s*(\d{1,2})\s*['′’]\s*(\d{1,2}(?:\.\d+)?)?\s*["″”]?\s*([NS])[\s,;]*(\d{1,3})\s*°\s*(\d{1,2})\s*['′’]\s*(\d{1,2}(?:\.\d+)?)?\s*["″”]?\s*([EW])/g;
  let m; while((m=re.exec(s))){ const c=m[1]?parseCoord(`${m[1]}${m[2]} ${m[3]}${m[4]}`):parseCoord(`${m[5]} ${m[6]} ${m[7]||0} ${m[8]} ${m[9]} ${m[10]} ${m[11]||0} ${m[12]}`); if(c) coords.push([c.lat,c.lon]); }
  const cm=s.match(/(CIRCLE|ОКРУЖНОСТ\S*|RADIUS|РАДИУС\S*)[^0-9]{0,40}?(\d+(?:\.\d+)?)\s*(KM|КМ|NM|М\.?\s*МИЛ\S*|M\b|М\b)/);
  if(cm&&coords.length>=1&&coords.length<=2){ const v=+cm[2], u=cm[3]; const r=/KM|КМ/.test(u)?v*1000:/NM|МИЛ/.test(u)?v*M_NM:v; return {kind:'circle',lat:coords[0][0],lon:coords[0][1],r}; }
  if(coords.length>1&&coords[0][0]===coords[coords.length-1][0]&&coords[0][1]===coords[coords.length-1][1]) coords.pop();
  return coords.length>=3?{kind:'polygon',coords}:null;
}

      const cs=el=>T(el,'coordinates').split(/\s+/).filter(Boolean).map(c=>{const [lo,la]=c.split(',').map(Number);return [la,lo];});
      if(pt){ const [c]=cs(pt); if(CFG.onlyUZ&&!inUZ(c[0],c[1]))return; const p=libAddPoint({name:nm||'WPT',type:'WPT',lat:c[0],lon:c[1],elev:null,elevSrc:'pending',freq:'',magVar:null,note:''}); queueElev(p); res.w++; }
      else if(pg){ const c=cs(pg); if(c.length<3) return; const tp=/(^|\W)(UT)?P[-\s]?\d/i.test(nm)?'P':/(^|\W)(UT)?R[-\s]?\d/i.test(nm)?'R':/(^|\W)(UT)?D[-\s]?\d/i.test(nm)?'D':'C'; LIB.zones.push({vis:true,id:'LZ'+uid(),name:nm||'Zone',type:tp,kind:'polygon',coords:c,lower:null,upper:null,maxTerr:null}); res.z++; } });
    return res; }
  return {};
}

/* ================= offline downloading ================= */
const lon2t=(lon,z)=>Math.floor((lon+180)/360*2**z);
const lat2t=(lat,z)=>{const r=rad(clamp(lat,-85.05,85.05));return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*2**z);};
function missionBounds(){ const ll=[]; MS.points.forEach(p=>ll.push([p.lat,p.lon])); MS.routes.forEach(r=>routePts(r).forEach(p=>ll.push([p.lat,p.lon]))); MS.zones.forEach(z=>{ if(z.kind==='circle'){[0,90,180,270].forEach(a=>{const q=direct(z.lat,z.lon,a,z.r);ll.push([q.lat,q.lon]);});} else z.coords.forEach(c=>ll.push(c)); }); return ll.length?L.latLngBounds(ll).pad(.15):null; }
function tileList(b,z0,z1){ const out=[]; for(let z=z0;z<=z1;z++){ const x0=lon2t(b.getWest(),z),x1=lon2t(b.getEast(),z),y0=lat2t(b.getNorth(),z),y1=lat2t(b.getSouth(),z); for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++) out.push({z,x,y}); if(out.length>60000) break; } return out; }
async function updOffline(){ const el=$('#offEst'); if(!el) return; const z0=clamp(+CFG.offZ0||7,1,18),z1=clamp(+CFG.offZ1||12,z0,18); const mb=missionBounds();
  const nm=mb?tileList(mb,z0,z1).length:0, nv=tileList(map.getBounds(),z0,z1).length, cached=await TileDB.count();
  el.textContent=t('Zoom {a}–{b}: mission {m} tiles · view {v} tiles · {c} stored',{a:z0,b:z1,m:nm,v:nv,c:cached}); }
let offBusy=false;
async function offDownload(area){
  if(offBusy) return; const z0=clamp(+CFG.offZ0||7,1,18),z1=clamp(+CFG.offZ1||12,z0,18);
  const b=area==='mission'?missionBounds():map.getBounds(); if(!b){toast(t('The mission has no points or zones yet.'));return;}
  const list=tileList(b,z0,z1), MAX=6000;
  if(list.length>MAX){ toast(t('{n} tiles is too many. Lower the top zoom or use a smaller view (limit {m}).',{n:list.length,m:MAX}),true); return; }
  const k=CFG.layer, d=layerDef(k), subs=(d.sub||'abc').split(''); if(!d.url){toast(t('No tile URL for this map.'));return;}
  offBusy=true; const pg=$('#offProg'); if(pg) pg.hidden=false; let done=0,fail=0,i=0;
  const worker=async()=>{ while(i<list.length){ const tl=list[i++]; const key=`${k}/${tl.z}/${tl.x}/${tl.y}`;
      if(!(await TileDB.get(key))){ try{ const url=L.Util.template(d.url,{s:subs[(tl.x+tl.y)%subs.length],x:tl.x,y:tl.y,z:tl.z,r:''}); const r=await fetch(url,{mode:'cors'}); if(!r.ok) throw 0; await TileDB.put(key,await r.blob()); }catch(e){fail++;} }
      done++; const bar=$('#offProg i'); if(bar) bar.style.width=(done/list.length*100)+'%'; } };
  await Promise.all(Array.from({length:6},worker));
  offBusy=false; if(pg) pg.hidden=true; updOffline();
  toast(fail?t('Stored {a} of {b} tiles. {c} failed — this provider may block offline storage; try OpenTopoMap or Esri.',{a:done-fail,b:done,c:fail}):t('Stored {n} tiles for offline use.',{n:done}),fail>done/2);
}

function download(name,text,mime){ const b=new Blob([text],{type:mime}),a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500); }
const xe=s=>esc(s);
const fname=ext=>(MS.name||'mission').replace(/[^\w\-а-яА-ЯёЁ]+/g,'_')+'.'+ext;
function gpx(withTrack){
  let s=`<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Flight Mission Navigator" xmlns="http://www.topografix.com/GPX/1/1">\n<metadata><name>${xe(MS.name)}</name></metadata>\n`;
  if(!withTrack){ MS.points.forEach(p=>{ s+=`<wpt lat="${p.lat.toFixed(7)}" lon="${p.lon.toFixed(7)}">${p.elev!=null?`<ele>${p.elev.toFixed(1)}</ele>`:''}<name>${xe(p.name)}</name><type>${xe(p.type)}</type>${p.freq||p.note?`<desc>${xe([p.freq,p.note].filter(Boolean).join(' · '))}</desc>`:''}</wpt>\n`; });
    MS.routes.forEach(r=>{ s+=`<rte><name>${xe(r.name)}</name>\n`; routePts(r).forEach(p=>{ s+=`<rtept lat="${p.lat.toFixed(7)}" lon="${p.lon.toFixed(7)}">${p.elev!=null?`<ele>${p.elev.toFixed(1)}</ele>`:''}<name>${xe(p.name)}</name></rtept>\n`; }); s+='</rte>\n'; }); }
  else { s+=`<trk><name>${xe(MS.name)} track</name><trkseg>\n`; MS.track.forEach(x=>{ s+=`<trkpt lat="${x[0]}" lon="${x[1]}">${x[2]!=null?`<ele>${x[2]}</ele>`:''}<time>${new Date(x[3]).toISOString()}</time></trkpt>\n`; }); s+='</trkseg></trk>\n'; }
  return s+'</gpx>\n';
}
function kml(){
  const col={TRN:'6e7a1f',EXR:'b04a5a',R:'005e9a',D:'144ac0',P:'1f20b3',C:'a06a3b'};
  let s=`<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${xe(MS.name)}</name>\n<Style id="rte"><LineStyle><color>ff7a15a0</color><width>3</width></LineStyle></Style>\n`;
  Object.entries(col).forEach(([k,c])=>{ s+=`<Style id="z${k}"><LineStyle><color>ff${c}</color><width>2</width></LineStyle><PolyStyle><color>33${c}</color></PolyStyle></Style>\n`; });
  s+='<Folder><name>Points</name>\n'; MS.points.forEach(p=>{ s+=`<Placemark><name>${xe(p.name)}</name><description>${xe(PTN(p.type))}${p.freq?' '+xe(p.freq):''}${p.elev!=null?' · '+Math.round(p.elev)+' m MSL':''}</description><Point><coordinates>${p.lon.toFixed(7)},${p.lat.toFixed(7)},${p.elev!=null?p.elev.toFixed(1):0}</coordinates></Point></Placemark>\n`; }); s+='</Folder>\n';
  s+='<Folder><name>Routes</name>\n'; MS.routes.forEach(r=>{ s+=`<Placemark><name>${xe(r.name)}</name><styleUrl>#rte</styleUrl><LineString><tessellate>1</tessellate><coordinates>${routePts(r).map(p=>`${p.lon.toFixed(7)},${p.lat.toFixed(7)},0`).join(' ')}</coordinates></LineString></Placemark>\n`; }); s+='</Folder>\n';
  s+='<Folder><name>Zones</name>\n'; MS.zones.forEach(z=>{ let c=z.kind==='circle'?Array.from({length:72},(_,i)=>{const q=direct(z.lat,z.lon,i*5,z.r);return [q.lat,q.lon];}):z.coords.slice(); if(!c.length)return; c.push(c[0]);
    s+=`<Placemark><name>${xe(z.name)}</name><description>${xe(ZTN(z.type))} · ${xe(bandTxt(z))}</description><styleUrl>#z${z.type}</styleUrl><Polygon><tessellate>1</tessellate><outerBoundaryIs><LinearRing><coordinates>${c.map(q=>`${q[1].toFixed(7)},${q[0].toFixed(7)},0`).join(' ')}</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark>\n`; }); s+='</Folder>\n';
  return s+'</Document></kml>\n';
}
function importXml(text,name){
  const doc=new DOMParser().parseFromString(text,'application/xml'); if(doc.querySelector('parsererror')) throw new Error('XML');
  let np=0,nr=0,nz=0; const T=(el,tg)=>{const x=el.getElementsByTagName(tg)[0];return x?x.textContent.trim():'';};
  const typeOf=tp=>{tp=(tp||'').toUpperCase().replace(/[^A-Z]/g,'');return PTK[tp]?tp:'WPT';};
  if(/\.gpx$/i.test(name)||doc.documentElement.nodeName==='gpx'){
    [...doc.getElementsByTagName('wpt')].forEach(w=>{ const p=mkP(T(w,'name')||nextName('WP'),typeOf(T(w,'type')),+w.getAttribute('lat'),+w.getAttribute('lon')); const e=num(T(w,'ele')); if(e!=null){p.elev=e;p.elevSrc='auto';} MS.points.push(p); if(e==null)queueElev(p); np++; });
    [...doc.getElementsByTagName('rte')].forEach(rt=>{ const r=newRoute(T(rt,'name')||t('Imported route'));
      [...rt.getElementsByTagName('rtept')].forEach(w=>{ const lat=+w.getAttribute('lat'),lon=+w.getAttribute('lon'); let p=MS.points.find(q=>Math.abs(q.lat-lat)<1e-6&&Math.abs(q.lon-lon)<1e-6); if(!p){p=mkP(T(w,'name')||nextName('WP'),'WPT',lat,lon);MS.points.push(p);queueElev(p);np++;} r.wpts.push(p.id); });
      MS.routes.push(r); nr++; });
  } else {
    [...doc.getElementsByTagName('Placemark')].forEach(pm=>{ const nm=T(pm,'name');
      const pt=pm.getElementsByTagName('Point')[0], ls=pm.getElementsByTagName('LineString')[0], pg=pm.getElementsByTagName('Polygon')[0];
      const cs=el=>T(el,'coordinates').split(/\s+/).filter(Boolean).map(c=>{const [lo,la]=c.split(',').map(Number);return [la,lo];});
      if(pt){ const [c]=cs(pt); const p=mkP(nm||nextName('WP'),'WPT',c[0],c[1]); MS.points.push(p); queueElev(p); np++; }
      else if(ls){ const r=newRoute(nm||t('Imported route')); cs(ls).forEach((c,i)=>{const p=mkP(`${(nm||'R').slice(0,4).toUpperCase()}${String(i+1).padStart(2,'0')}`,'WPT',c[0],c[1]);MS.points.push(p);queueElev(p);r.wpts.push(p.id);np++;}); MS.routes.push(r); nr++; }
      else if(pg){ const c=cs(pg); if(c.length>1&&c[0][0]===c[c.length-1][0]&&c[0][1]===c[c.length-1][1]) c.pop(); MS.zones.push({id:uid(),name:nm||t('Imported zone'),type:'TRN',kind:'polygon',coords:c,lower:null,upper:null,maxTerr:null}); nz++; } });
  }
  MS.zones.forEach(z=>{if(z.vis===undefined)z.vis=true;}); save(); renderMap(); return t('Imported {p} points, {r} routes, {z} zones.',{p:np,r:nr,z:nz});
}

const TU={on:false,ang:0};
if(CFG.trackUp===undefined) CFG.trackUp=true;
const mapEl=$('#map');
function tuWanted(){ return CFG.trackUp!==false&&!!FLY.pos&&(FLY.gps||FLY.sim)&&FLY.follow&&!!(FLY.routeId||FLY.direct); }
function tuHeading(){ if(FLY.trk!=null&&FLY.gs>15) return FLY.trk; const n=FLY.nav; if(n&&n.dtk!=null) return n.dtk; return FLY.trk??TU.ang; }
function tuSize(on){
  if(on){ const W=innerWidth,H=innerHeight,D=Math.ceil(Math.hypot(W,H))+4; Object.assign(mapEl.style,{width:D+'px',height:D+'px',left:((W-D)/2)+'px',top:((H-D)/2)+'px',right:'auto',bottom:'auto'}); }
  else { Object.assign(mapEl.style,{width:'',height:'',left:'',top:'',right:'',bottom:'',transform:''}); }
  try{ map.invalidateSize({animate:false}); }catch(e){}
}
function applyTU(){
  const on=tuWanted();
  if(on!==TU.on){ TU.on=on; document.body.classList.toggle('tu',on); tuSize(on);
    try{ map.dragging&&map.dragging[on?'disable':'enable'](); }catch(e){}
    if(map.options){ map.options.touchZoom=on?'center':true; map.options.scrollWheelZoom=on?'center':true; map.options.doubleClickZoom=on?'center':true; }
    if(!on){ TU.ang=0; document.documentElement.style.setProperty('--unrot','0deg'); }
    let at=$('#tuAttr'); if(!at){ at=document.createElement('div'); at.id='tuAttr'; document.body.appendChild(at); }
    at.hidden=!on; if(on) at.textContent=(layerDef(CFG.layer).attr||'')+' · Leaflet';
    if(FLY.pos&&on) followPan([FLY.pos.lat,FLY.pos.lon]); }
  if(on){ const h=tuHeading(), d=((h-TU.ang)%360+540)%360-180; TU.ang+=d;
    mapEl.style.transform=`rotate(${-TU.ang}deg)`; document.documentElement.style.setProperty('--unrot',TU.ang+'deg'); }
  updOri();
}
/* keep the aircraft in the lower part of the screen so more of the route ahead is visible */
function followPan(ll){
  if(!TU.on){ map.panTo(ll,{animate:true,duration:.6}); return; }
  const z=map.getZoom(), mpp=40075016.686*Math.cos(rad(ll[0]))/Math.pow(2,z+8), off=innerHeight*0.2*mpp, c=direct(ll[0],ll[1],TU.ang,off);
  map.panTo([c.lat,c.lon],{animate:true,duration:.8});
}
/* screen point → map container point, accounting for the rotation */
function clientToCP(cx,cy){ const r=mapEl.getBoundingClientRect(), dx=cx-(r.left+r.width/2), dy=cy-(r.top+r.height/2);
  if(!TU.on) return L.point?L.point(cx-r.left,cy-r.top):{x:cx-r.left,y:cy-r.top};
  const a=rad(TU.ang), x=dx*Math.cos(a)-dy*Math.sin(a)+mapEl.offsetWidth/2, y=dx*Math.sin(a)+dy*Math.cos(a)+mapEl.offsetHeight/2;
  return L.point?L.point(x,y):{x,y}; }
{ const _m=map.mouseEventToContainerPoint&&map.mouseEventToContainerPoint.bind(map);

function renderLayerMenu(){ const s=CFG.libShow, ck=(k,l)=>`<label><input type="checkbox" data-on="libShow" data-k="${k}" ${s[k]?'checked':''}> ${t(l)}</label>`;
  const o=CFG.ovl||{};
  $('#layerMenu').innerHTML=LGROUPS.map(([g,gn])=>`<div class="lm-h">${t(gn)}</div>`+Object.entries(LAYERS).filter(([k,d])=>d.g===g).map(([k,d])=>`<button data-act="setLayer" data-k="${k}" aria-pressed="${CFG.layer===k}">${esc(d.name)}${d.fb?`<small class="lm-fb">${t('Backup: {b}',{b:d.fb.map(x=>LAYERS[x].name).join(', ')})}</small>`:''}</button>`).join('')).join('')
  +`<div class="lm-h">${t('Overlays')}</div>`+Object.entries(OVL).map(([k,d])=>`<label><input type="checkbox" data-on="ovl" data-k="${k}" ${o[k]?'checked':''}> ${t(d.name)}</label>`).join('')
  +`<div class="lm-h">${t('Reference layers')}</div>${ck('ad','Aerodromes')}${ck('small','Small airfields & heliports')}${ck('nav','Navaids')}${ck('wpt','Reporting points & waypoints')}${ck('asp','Airspace')}${ck('rwy','Runways')}${ck('proc','SID / STAR')}${ck('brd','Border of Uzbekistan')}`; }
function updFab(){ $('#fabFollow').classList.toggle('on',!!(FLY.follow&&FLY.pos)); $('#fabMeasure').classList.toggle('on',!!(MODE&&MODE.type==='measure')); }
const isPhone=()=>innerWidth<900;

$('#grab').addEventListener('click',()=>{ const s=$('#sheet').dataset.state; setSheet(s==='min'?'half':s==='half'?'full':'min'); });
(()=>{ let y0=null,s0=null; const g=$('#grab');
  g.addEventListener('touchstart',e=>{y0=e.touches[0].clientY;s0=$('#sheet').dataset.state;},{passive:true});
  g.addEventListener('touchend',e=>{ if(y0==null)return; const dy=e.changedTouches[0].clientY-y0; y0=null; if(Math.abs(dy)<30)return; const o=['min','half','full'],i=o.indexOf(s0); setSheet(o[clamp(i+(dy<0?1:-1),0,2)]); e.preventDefault(); }); })();
let toastT=null;
function toast(msg,danger){ const tt=$('#toast'); tt.textContent=msg; tt.classList.toggle('danger',!!danger); tt.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>tt.classList.remove('show'),danger?5200:3200); }
const NIGHT_FILTER={navy:'brightness(.66) contrast(1.08) saturate(.55) sepia(.35) hue-rotate(178deg)',dim:'brightness(.6) contrast(1.1) saturate(.8)',nvg:'grayscale(1) brightness(.5) sepia(1) hue-rotate(45deg) saturate(2.6) contrast(1.15)',off:'none'};
function applyTheme(){ const r=document.documentElement; if(CFG.theme==='system') delete r.dataset.theme; else r.dataset.theme=CFG.theme;
  const dark=CFG.theme==='dark'||(CFG.theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);
  r.style.setProperty('--tile-filter',dark?NIGHT_FILTER[CFG.mapNight]||'none':'none'); setTimeout(drawProfile,50); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
window.addEventListener('resize',()=>{ if(!$('#hud').hidden) document.documentElement.style.setProperty('--hud-h',$('#hud').offsetHeight+'px'); drawProfile(); });
map.on('moveend',()=>{ if(VIEW.tab==='more') updOffline(); });

/* ================= boot ================= */
(()=>{ let seed=null; try{ const tx=$('#fmn-seed').textContent.trim(); if(tx) seed=JSON.parse(tx); }catch(e){}
  const fresh=!lsGet('fmn.mission.v1');
  migrate(); reindex();
  if(seed&&seed.format==='fmn-package'&&lsGet('fmn.seedSeen')!==seed.created){ if(fresh){ lsSet('fmn.seedSeen',seed.created); applyPackage(seed,'replace'); } else PENDING_SEED=seed; }
  saveLib(); })();
VIEW.tab='home'; applyTheme(); setBase(CFG.layer); initBorder(); showHud(); applyLangChrome(); renderTabs(); renderStatus(); renderMap(); renderPanel(); setSheet('min'); zoomCls(); setTimeout(showHud,300);
{ const b=missionBounds(); if(b) map.fitBounds(b,{paddingBottomRight:isPhone()?[0,innerHeight*.42]:[0,0],paddingTopLeft:isPhone()?[0,0]:[420,0]}); }
MS.points.filter(p=>p.elevSrc!=='manual'&&(p.elev==null||p.elevSrc==='pending'||p.elevSrc==='failed')).forEach(queueElev);
MS.routes.forEach(r=>{ if(!r.profile&&r.wpts.length>1) sampleTerrain(r,true); if(r.magVar==null) autoRouteVar(r); });
if(MS.track.length) drawTrack();
const autoUpd=()=>{ if(!LIB.checked||Date.now()-LIB.checked>12*3600e3) checkUpdates(false); }; setTimeout(autoUpd,4000); setInterval(autoUpd,30*60e3); window.addEventListener('online',()=>setTimeout(autoUpd,3000));
setInterval(()=>{ renderStatus(); renderTabs(); if(VIEW.tab==='fly') updFlyLive(); },5000);
